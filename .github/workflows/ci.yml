name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libx11-dev \
            glslc

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Depth-array sampling and attachment regression (Lavapipe)
        run: |
          set -euo pipefail
          for icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            test -f "$icd"
            export VK_ICD_FILENAMES="$icd"
            ./build/image_view_test
            break
          done
